<!DOCTYPE html>
<html>
<head>
    <title>QZ Tray Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qz-tray/2.2.2/qz-tray.js"></script>
</head>
<body>
    <h2>QZ Tray Test</h2>
    <button onclick="testQZ()">Test QZ Connection</button>
    <pre id="out"></pre>

    <script>
        const out = document.getElementById("out");

        qz.security.setCertificatePromise(resolve => resolve());
        qz.security.setSignatureAlgorithm("SHA512");
        qz.security.setSignaturePromise(toSign => resolve => resolve());

        async function testQZ() {
            out.textContent = "Connecting...";

            try {
                if (!qz.websocket.isActive()) {
                    await qz.websocket.connect({ retries: 1, delay: 1 });
                }

                const printers = await qz.printers.find();
                out.textContent = "Connected to QZ Tray\n\nPrinters:\n" + JSON.stringify(printers, null, 2);
            } catch (e) {
                out.textContent = "QZ connection failed:\n" + e.message;
            }
        }
    </script>
</body>
</html>
